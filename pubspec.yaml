name: flutility
description: A new Flutter project.
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.18+855

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  marina_labs_common:
    git:
      url: https://github.com/marina-labs/marina_labs_common.git
      ref: 01140a2d6f8b892af26290c0e6688ef1c5aed80c
  ## DATA HANDLE PACKAGES
  firebase_core: ^4.12.1
  firebase_storage: ^13.4.5
  cloud_firestore: ^6.7.1
  # This lib to set windows size on Windows.
  window_manager: ^0.5.2
  http: ^1.6.0
  # A Flutter plugin for finding commonly used locations on the filesystem
  path_provider: ^2.1.6
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  # Save settings
  shared_preferences: ^2.5.5
  # SQLite database
  sqflite: ^2.4.3
  sqflite_common_ffi: ^2.4.2
  # Hive NoSQL database
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  ##
  # Package for Packaging Windows App
  msix: ^3.18.0
  # State management combination
  flutter_bloc: ^9.1.1
  # Open link
  url_launcher: ^6.3.2
  go_router: ^17.3.0
  collection: ^1.19.1
  path: ^1.9.1
  image_picker: ^1.2.3
  flutter_quill: ^11.5.1


  ### UI PACKAGES
  responsive_builder: ^0.7.1
  loading_indicator: ^3.1.1
  # use for customizing theme
  dynamic_color: ^1.8.1
  # localization
  flutter_localization: ^0.4.1
  flutter_localizations:
    sdk: flutter
  i18n_extension: ^15.1.1
  # custom icon
  font_awesome_flutter: ^11.0.0
  flutter_sizer: ^1.0.5
  device_info_plus: ^10.1.2
  flutter_spinkit: ^5.2.2
  http_parser: ^4.1.2
  equatable: ^2.1.0
  file_picker: ^11.0.2
  open_file_plus: ^3.4.1+1
  loading_animation_widget: ^1.3.0
  intl: ^0.20.3
  string_validator: ^1.2.0
  windows_status_bar:
    git: https://github.com/tranhuudang/windows_status_bar
  fluentui_system_icons: ^1.1.273
  dotted_border: ^3.1.0
  google_fonts: ^8.2.0
  image: ^4.9.1
  flex_color_picker: ^3.8.0
  upgrader: ^13.5.0
  flutter_colorpicker: ^1.1.0
  flutter_svg: ^2.3.0
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  search_choices: ^2.3.1

dependency_overrides:
  # Override the version of `analyzer` to ensure compatibility with `custom_lint`.
  intl: ^0.19.0
  flutter_localization: ^0.4.1
  analyzer: ^10.0.0
  analyzer_plugin: ^0.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.0+1
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0
  build_runner: ^2.4.15
  freezed: ^3.0.2
  json_serializable: ^6.14.0

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/
    - assets/fluentui-system-icons/
    - assets/release_notes/release_notes.json
    - assets/badges/
    - assets/images/app_icon.png
    - assets/donation/
    
msix_config:
  display_name: Flutility
  publisher_display_name: Marina Labs
  identity_name: 24555Zeroboy.FlutterToolkits
  publisher: CN=DA7D2C99-987C-4B69-8953-17157F6E0E1A
  msix_version: 2025.5.21.0
  trim_logo: false
  logo_path: C:\Users\tranh\StudioProjects\Flutility\assets\images\app_icon.png
  store: true
  language: en-us, vi-vi, zh-cn